services:
  - type: web
    name: chalinze-steel-mills
    env: node
    plan: starter
    region: singapore
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        value: admin@chalinze.co.tz
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIRECTORY
        value: /var/data
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 10
